# Cam2You for iOS, called by cam2you-release.yml: builds from the commits
# it is given, tries what it built, and uploads the files for the release as
# the artifact dist-ios, with their lines for the release notes as
# notes-ios (a Markdown file).
#
# Both builds carry Auto-edit's engine (cam2you's engine/, Rust) and the LGPL
# FFmpeg it uses, as frameworks (cam2you's tool/build_ffmpeg_ios.sh, for
# iPhones and the simulator; kept in the cache while that script and tool/ffmpeg_apple_source.sh are the same).
# First a build for the simulator is installed and started on an iPhone
# simulator: it must still run after 40 s, with its database made and its
# self-check passed (keychain, database, two clips joined by the AVFoundation
# renderer, the engine loaded and the clips auto-edited); a screenshot and the
# self-check are the artifact ios-test. Then the release build for iPhones, packed as
# Cam2You-<version>-unsigned.ipa: an iPhone installs only signed apps, so
# installing it needs the Apple Developer Program (TestFlight, the App Store)
# or a sideloading tool that signs it with the user's own Apple ID.
name: Build iOS

on:
  workflow_call:
    inputs:
      cam2you:
        description: cam2you commit
        type: string
        required: true
      version:
        description: Cam2You's version
        type: string
        required: true

env:
  FLUTTER_VERSION: 3.47.5
  # Compiler warnings would quote the private sources in this public log.
  RUSTFLAGS: -Awarnings

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TIE-Channel/cam2you
          ref: ${{ inputs.cam2you }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: cam2you
          persist-credentials: false
      - name: Tools
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: engine-ios-cargo-${{ hashFiles('cam2you/engine/Cargo.lock') }}
          restore-keys: engine-ios-cargo-
      # FFmpeg for the engine, saved as soon as it is built (even when a
      # later step fails).
      - uses: actions/cache/restore@v4
        id: ffmpeg
        with:
          path: cam2you/third_party/ffmpeg-ios
          key: cam2you-ffmpeg-ios-${{ hashFiles('cam2you/tool/build_ffmpeg_ios.sh', 'cam2you/tool/ffmpeg_apple_source.sh') }}
      - name: FFmpeg for iOS (LGPL, frameworks)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        working-directory: cam2you
        run: WORK="$RUNNER_TEMP/ffmpeg" bash tool/build_ffmpeg_ios.sh third_party/ffmpeg-ios
      - uses: actions/cache/save@v4
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        with:
          path: cam2you/third_party/ffmpeg-ios
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: Build config
        env:
          BUILD_CONFIG_JSON: ${{ secrets.BUILD_CONFIG_JSON }}
        working-directory: cam2you
        run: |
          if [ -n "$BUILD_CONFIG_JSON" ]; then
            printf '%s' "$BUILD_CONFIG_JSON" > build_config.json
            echo 'DEFINE=--dart-define-from-file=build_config.json' >> "$GITHUB_ENV"
          fi
          flutter pub get

      # With the engine (engine/scripts/env-cam2you-ios.sh sets
      # CAM2YOU_ENGINE=1, and builds it optimized in this debug build).
      - name: Cam2You for the simulator
        working-directory: cam2you
        run: |
          source engine/scripts/env-cam2you-ios.sh iphonesimulator
          flutter build ios --simulator --debug ${DEFINE:-}
          app=build/ios/iphonesimulator/Cam2You.app
          for framework in cam2you_engine libavcodec libavformat libavfilter libavutil libswscale libswresample; do
            if [ ! -d "$app/Frameworks/$framework.framework" ]; then echo "::error::No $framework.framework in the app"; exit 1; fi
          done
          lipo -archs "$app/Frameworks/cam2you_engine.framework/cam2you_engine"
          du -sh "$app/Frameworks/cam2you_engine.framework"

      - name: Start on an iPhone simulator
        run: |
          set -euo pipefail
          mkdir -p test
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.split(".iOS-")[1].split("-"))
              for d in devices:
                  if d["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, d["udid"], d["name"])
          print(best[1])
          sys.stderr.write("%s, iOS %s\n" % (best[2], ".".join(map(str, best[0]))))
          ')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b > /dev/null
          xcrun simctl install "$device" cam2you/build/ios/iphonesimulator/Cam2You.app
          data=$(xcrun simctl get_app_container "$device" com.tiegames.cam2you data)
          support="$data/Library/Application Support"
          mkdir -p "$support/SelfCheck"
          xcrun swift cam2you/tool/make_test_clips.swift "$support/SelfCheck"
          # The self-check asked for (an app on the simulator may not see
          # SIMCTL_CHILD_ variables).
          touch "$support/self-check.request"

          SIMCTL_CHILD_CAM2YOU_SELF_CHECK=1 xcrun simctl launch --stdout="$PWD/test/cam2you-ios.log" \
            --stderr="$PWD/test/cam2you-ios.log" "$device" com.tiegames.cam2you
          # At least 40 s; the self-check ends within its time limits.
          for i in $(seq 1 600); do
            if [ -f "$support/self-check.json" ] && [ "$i" -ge 40 ]; then break; fi
            sleep 1
          done
          xcrun simctl io "$device" screenshot test/cam2you-ios.png > /dev/null || echo '::warning::No screenshot'
          running=$(xcrun simctl spawn "$device" launchctl list | grep 'UIKitApplication:com.tiegames.cam2you' | awk '{print $1}' || true)
          cp "$support/self-check.json" "$support/self-check.running.json" test/ 2> /dev/null || true
          tail -20 test/cam2you-ios.log || true
          # Flutter's own lines (print, uncaught errors) go to the system log.
          xcrun simctl spawn "$device" log show --last 10m --style compact \
            --predicate 'process == "Cam2You" AND eventMessage CONTAINS "flutter"' > test/cam2you-ios-flutter.log 2>&1 || true
          tail -40 test/cam2you-ios-flutter.log || true
          if [ -f test/self-check.running.json ]; then cat test/self-check.running.json; fi
          if [ -z "$running" ] || [ "$running" = - ]; then echo '::error::Cam2You is not running 40 s after it was started'; exit 1; fi
          if [ ! -f "$support/state.sqlite" ]; then echo '::error::Cam2You made no database'; exit 1; fi
          if [ ! -f test/self-check.json ]; then echo '::error::Cam2You wrote no self-check'; exit 1; fi
          cat test/self-check.json
          python3 - <<'PY'
          import json, sys
          check = json.load(open('test/self-check.json'))
          failed = [name for name, c in check.items() if isinstance(c, dict) and not c.get('ok')]
          for name in ('storage', 'database', 'render', 'engine', 'auto-edit'):
              if name not in check:
                  failed.append(name + ' (not checked)')
          if failed:
              print('::error::Cam2You self-check failed: ' + ', '.join(failed))
              sys.exit(1)
          print('Cam2You starts on the iPhone simulator: keychain, database, a video joined by AVFoundation and one auto-edited by the engine')
          e, a = check['engine'], check['auto-edit']
          print('::notice title=iOS simulator self-check::engine %s, speech %s, music plan %s ms; auto-edit %s bytes in %s ms'
                % (e.get('version'), e.get('speech'), e.get('took_ms'), a.get('bytes'), a.get('took_ms')))
          PY
          xcrun simctl shutdown "$device" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test
          path: test/
          if-no-files-found: ignore

      - name: Cam2You for iPhones (unsigned)
        working-directory: cam2you
        run: |
          source engine/scripts/env-cam2you-ios.sh iphoneos
          flutter build ios --release --no-codesign ${DEFINE:-}
          app=build/ios/iphoneos/Cam2You.app
          for framework in cam2you_engine libavcodec libavformat libavfilter libavutil libswscale libswresample; do
            if [ ! -d "$app/Frameworks/$framework.framework" ]; then echo "::error::No $framework.framework in the app"; exit 1; fi
          done
          du -sh "$app/Frameworks"/*.framework | sort -h | tail -8
          mkdir -p ../ipa/Payload ../dist
          ditto build/ios/iphoneos/Cam2You.app ../ipa/Payload/Cam2You.app
          (cd ../ipa && zip -qry "../dist/Cam2You-$VERSION-unsigned.ipa" Payload)
          ls -l ../dist
          echo "::notice title=iOS ipa::Cam2You-$VERSION-unsigned.ipa $(stat -f %z "../dist/Cam2You-$VERSION-unsigned.ipa") bytes"

      - name: Notes
        run: |
          mkdir -p notes
          {
            echo '**iPhone** (iOS 15 or newer):'
            echo
            echo "- **Cam2You-$VERSION-unsigned.ipa**: Cam2You for iPhones, built and tried on the iPhone simulator but not signed. An iPhone installs only apps signed through Apple, so it can't be installed as it is: that needs TestFlight or the App Store (the Apple Developer Program), or a sideloading tool (such as AltStore or Sideloadly) that signs it with your own Apple ID — with a free Apple ID such an install runs for 7 days."
          } > notes/5-ios.md
          cat notes/5-ios.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes-ios
          path: notes/5-ios.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: dist/*.ipa
          if-no-files-found: error
