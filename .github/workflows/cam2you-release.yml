# Builds Cam2You and Montage for Windows and Android and publishes them as a
# release of this repository, tagged cam2you-v<version>: the Download section
# of tie-games.com/cam2you links to the newest one, and Cam2You's small web
# installer downloads from it (cam2you's SPEC §13.1). It runs here, in the
# site's public repository, where Actions minutes are free; the sources stay
# private: they are only checked out on the runners.
#
# Run it by hand: Actions → Cam2You release → Run workflow. Before a release
# is made the Windows installer is tried on its runner (installed, both apps
# started, both removed again) and Cam2You's APK on an Android emulator
# (installed and started). Montage's APK is left out of a release when its
# build fails; everything else must succeed.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SOURCE_TOKEN       a fine-grained personal access token: owner TIE-Channel,
#                      repositories cam2you and Montage, permission Contents:
#                      Read-only
#   BUILD_CONFIG_JSON  cam2you's build_config.json (Google sign-in, its SPEC
#                      §8.11); without it Cam2You is built without sign-in
#   ANDROID_SIGNING    the TIE-Games Android signing key, as JSON: "keystore"
#                      (a PKCS #12 file, base64), "password", "alias". Every
#                      version must be signed with it, or Android won't
#                      install it over the last one. A draft can do without
#                      (a throwaway key, not to be installed over a release).
name: Cam2You release

on:
  workflow_dispatch:
    inputs:
      cam2you_ref:
        description: Cam2You branch, tag or commit
        default: main
      montage_ref:
        description: Montage branch, tag or commit
        default: main
      publish:
        description: Publish the release (else a draft, seen only by those who can edit this repository)
        type: boolean
        default: true
      replace:
        description: Replace the release of this version if there is one
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cam2you-release

env:
  FLUTTER_VERSION: 3.47.5
  # Compiler warnings would quote the private sources in this public log.
  RUSTFLAGS: -Awarnings

jobs:
  # The version, and the commits every job builds, whatever the branches do
  # meanwhile.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      montage_version: ${{ steps.version.outputs.montage_version }}
      cam2you: ${{ steps.version.outputs.cam2you }}
      montage: ${{ steps.version.outputs.montage }}
    steps:
      - name: Secrets
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          BUILD_CONFIG_JSON: ${{ secrets.BUILD_CONFIG_JSON }}
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo '::error::No SOURCE_TOKEN secret: see the top of .github/workflows/cam2you-release.yml'; exit 1
          fi
          if [ -z "$BUILD_CONFIG_JSON" ]; then
            echo '::warning::No BUILD_CONFIG_JSON secret: Cam2You is built without Google sign-in'
          fi
          if [ -z "$ANDROID_SIGNING" ]; then
            if [ "$PUBLISH" = true ]; then
              echo '::error::No ANDROID_SIGNING secret: a published release needs the TIE-Games key, or its APKs would not update the installed apps (see the top of this file)'; exit 1
            fi
            echo "::warning::No ANDROID_SIGNING secret: this draft's APKs are signed with a throwaway key; don't install them over a release"
          fi

      - uses: actions/checkout@v4
        with:
          repository: TIE-Channel/cam2you
          ref: ${{ inputs.cam2you_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: cam2you
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TIE-Channel/Montage
          ref: ${{ inputs.montage_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: Montage
          persist-credentials: false

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace }}
        run: |
          version=$(grep -oP '^version:\s*\K[\d.]+' cam2you/pubspec.yaml)
          tag="cam2you-v$version"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "montage_version=$(grep -oP '^version:\s*\K[\d.]+' Montage/app/pubspec.yaml)"
            echo "cam2you=$(git -C cam2you rev-parse HEAD)"
            echo "montage=$(git -C Montage rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [ "$REPLACE" != true ]; then
            echo "::error::Cam2You $version is released already: raise the version in cam2you's pubspec.yaml, or tick Replace"; exit 1
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TIE-Channel/cam2you
          ref: ${{ needs.prepare.outputs.cam2you }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: cam2you
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TIE-Channel/Montage
          ref: ${{ needs.prepare.outputs.montage }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: Montage
          persist-credentials: false

      # Built from short folders: whisper.cpp's build nests deep paths under
      # Montage (.ck, see its cargokit.cmake), and cl.exe stops at 260
      # characters, which D:\a\tie-games-com\tie-games-com\ goes past.
      - name: Short paths
        run: |
          robocopy Montage C:\M /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw 'Montage was not copied' }
          robocopy cam2you C:\C /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw 'cam2you was not copied' }
          exit 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # cl, Ninja and CMake for whisper.cpp in Montage's core.
      - uses: ilammy/msvc-dev-cmd@v1
      # Speech recognition on the graphics card (whisper.cpp's Vulkan backend):
      # the SDK only, so the runner has no Vulkan loader of its own, like a PC
      # without a graphics driver that brings one.
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            C:\M\.ck
          key: montage-rust-${{ hashFiles('Montage/app/rust/Cargo.lock', 'Montage/core/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            montage-rust-${{ hashFiles('Montage/app/rust/Cargo.lock', 'Montage/core/Cargo.lock') }}-
            montage-rust-

      - name: Montage
        working-directory: C:\M
        run: |
          ./scripts/fetch-ffmpeg.ps1
          . ./scripts/env.ps1
          Set-Location app
          flutter pub get
          flutter build windows --release

      - name: Cam2You
        working-directory: C:\C
        env:
          BUILD_CONFIG_JSON: ${{ secrets.BUILD_CONFIG_JSON }}
        run: |
          $define = $null
          if ($env:BUILD_CONFIG_JSON) {
            [IO.File]::WriteAllText("$PWD/build_config.json", $env:BUILD_CONFIG_JSON)
            $define = '--dart-define-from-file=build_config.json'
          }
          flutter pub get
          dart run tool/fetch_ffmpeg.dart
          flutter build windows --release $define

      - name: Installers
        working-directory: C:\C
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
          dart run tool/build_installer.dart --montage C:\M\app\build\windows\x64\runner\Release
          Get-ChildItem build/installer/*.exe | Format-Table Name, Length

      # The full installer as a user runs it, unattended: Cam2You and Montage
      # installed for this user, both start, both are removed again.
      - name: Install, start, remove
        working-directory: C:\C\build\installer
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          function WaitFor([scriptblock] $done, [int] $seconds) {
            for ($i = 0; $i -lt $seconds -and -not (& $done); $i++) { Start-Sleep 1 }
            return (& $done)
          }
          $programs = "$env:LOCALAPPDATA\Programs"
          $media = Test-Path "$env:WINDIR\System32\mfplat.dll"
          if (-not $media) {
            # Windows Server has Media Foundation as a feature; Windows 10 and 11 have it.
            Install-WindowsFeature Server-Media-Foundation -ErrorAction SilentlyContinue | Out-Null
            $media = Test-Path "$env:WINDIR\System32\mfplat.dll"
          }
          $loader = Test-Path "$env:WINDIR\System32\vulkan-1.dll"
          "Media Foundation: $media; Windows' own Vulkan loader: $loader"

          $log = "$env:RUNNER_TEMP\setup.log"
          $setup = Start-Process -Wait -PassThru ".\Cam2You-Setup-$env:VERSION.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log"
          if ($setup.ExitCode -ne 0) { Get-Content $log -Tail 30; throw "The installer failed: $($setup.ExitCode)" }
          $cam = "$programs\Cam2You\cam2you.exe"
          $montage = "$programs\Montage\montage_app.exe"
          if (-not (Test-Path $cam)) { throw "No $cam" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Cam2You.lnk")) { throw 'No desktop shortcut' }

          if ($media) {
            if (-not (Test-Path $montage)) { Get-Content $log -Tail 30; throw "No $montage" }
            $record = "$env:LOCALAPPDATA\Montage\app.json"
            if (-not (Test-Path $record)) { throw "No $record" }
            if (-not $loader -and -not (Test-Path "$programs\Montage\vulkan-1.dll")) { throw 'No Vulkan loader for Montage' }
            # Montage writes its record again once its core is loaded: it starts.
            Remove-Item $record
            $p = Start-Process $montage -PassThru
            $started = WaitFor { Test-Path $record } 90
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (-not $started) { throw 'Montage did not start: no app.json after 90 s' }
            "Montage starts: $(Get-Content $record)"
          } elseif (-not (Select-String -Path $log -Pattern 'Montage is left out' -Quiet)) {
            throw 'Montage was neither installed nor left out on purpose'
          }

          # Cam2You opens its database once it is up.
          $p = Start-Process $cam -PassThru
          $started = WaitFor { Get-ChildItem $env:APPDATA -Recurse -Depth 3 -Filter state.sqlite -ErrorAction SilentlyContinue } 90
          $running = -not $p.HasExited
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $running) { throw "Cam2You stopped by itself: $($p.ExitCode)" }
          if ($started) { 'Cam2You starts' } else { '::warning::Cam2You runs, but made no database within 90 s' }

          foreach ($app in @("$programs\Cam2You", "$programs\Montage")) {
            if (-not (Test-Path "$app\unins000.exe")) { continue }
            Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
            if (-not (WaitFor { -not (Test-Path "$app\unins000.exe") } 120)) { throw "$app was not removed" }
          }
          'Both removed'

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: C:\C\build\installer\*.exe
          if-no-files-found: error

  # Cam2You for Android phones: one APK for 64-bit ARM phones and x86-64
  # (Chromebooks, the emulator), signed with the TIE-Games key, then installed
  # and started on an Android 14 emulator.
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TIE-Channel/cam2you
          ref: ${{ needs.prepare.outputs.cam2you }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: cam2you
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          signing = os.environ.get('ANDROID_SIGNING')
          if not signing:
              print('A throwaway debug key: no ANDROID_SIGNING secret')
              raise SystemExit
          key = json.loads(signing)
          print(f"::add-mask::{key['password']}")
          path = os.path.join(os.environ['RUNNER_TEMP'], 'tie-games.p12')
          with open(path, 'wb') as f:
              f.write(base64.b64decode(key['keystore']))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"ANDROID_KEYSTORE={path}\nANDROID_KEYSTORE_PASSWORD={key['password']}\n")
              env.write(f"ANDROID_KEY_ALIAS={key.get('alias', 'tie-games')}\n")
          PY

      - name: Cam2You
        working-directory: cam2you
        env:
          BUILD_CONFIG_JSON: ${{ secrets.BUILD_CONFIG_JSON }}
        run: |
          define=()
          if [ -n "$BUILD_CONFIG_JSON" ]; then
            printf '%s' "$BUILD_CONFIG_JSON" > build_config.json
            define=(--dart-define-from-file=build_config.json)
          fi
          flutter pub get
          flutter build apk --release --target-platform android-arm64,android-x64 "${define[@]}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/Cam2You-$VERSION.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "../dist/Cam2You-$VERSION.apk" | grep -E 'certificate (DN|SHA-256)'
          ls -l ../dist

      # The emulator needs KVM, which the runner has but doesn't open to it.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          cat > smoke.sh <<'SH'
          set -euo pipefail
          mkdir -p test
          adb install -r "dist/Cam2You-$VERSION.apk"
          adb logcat -c
          adb shell monkey -p com.tiegames.cam2you -c android.intent.category.LAUNCHER 1 > /dev/null
          sleep 40
          adb exec-out screencap -p > test/cam2you-android.png || true
          if adb logcat -d | grep -q 'FATAL EXCEPTION'; then
            adb logcat -d | grep -A40 'FATAL EXCEPTION' | head -80
            echo '::error::Cam2You crashed on Android'; exit 1
          fi
          if ! adb shell pidof com.tiegames.cam2you > /dev/null; then
            adb logcat -d -s AndroidRuntime:E flutter:V | tail -60
            echo '::error::Cam2You is not running 40 s after it was started'; exit 1
          fi
          echo 'Cam2You installs and starts on Android 14'
          SH
      - name: Install and start on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test
          path: test/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  # Montage for Android (64-bit ARM, as its core is built): FFmpeg built for
  # Android first (kept in the cache while its script is the same), then the
  # Rust core with whisper.cpp through cargokit, as scripts/build-android.ps1
  # does in Windows.
  montage-android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    env:
      MONTAGE_VERSION: ${{ needs.prepare.outputs.montage_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TIE-Channel/Montage
          ref: ${{ needs.prepare.outputs.montage }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: Montage
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Tools and NDK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q meson ninja-build pkg-config xxd
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' > /dev/null

      - uses: actions/cache@v4
        id: ffmpeg
        with:
          path: Montage/third_party/ffmpeg-android
          key: montage-ffmpeg-android-${{ hashFiles('Montage/scripts/build-ffmpeg-android.sh') }}
      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: WORK="$RUNNER_TEMP/ffmpeg-android" bash Montage/scripts/build-ffmpeg-android.sh

      - name: Signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          signing = os.environ.get('ANDROID_SIGNING')
          if not signing:
              print('A throwaway debug key: no ANDROID_SIGNING secret')
              raise SystemExit
          key = json.loads(signing)
          print(f"::add-mask::{key['password']}")
          path = os.path.join(os.environ['RUNNER_TEMP'], 'tie-games.p12')
          with open(path, 'wb') as f:
              f.write(base64.b64decode(key['keystore']))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"ANDROID_KEYSTORE={path}\nANDROID_KEYSTORE_PASSWORD={key['password']}\n")
              env.write(f"ANDROID_KEY_ALIAS={key.get('alias', 'tie-games')}\n")
          PY

      - name: Montage
        working-directory: Montage
        run: |
          source scripts/env-android.sh
          cd app
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          apk=build/app/outputs/flutter-apk/app-release.apk
          # Flutter makes an APK without the core when its build fails: it must be there.
          for lib in libmontage_bridge.so libavcodec.so libc++_shared.so; do
            unzip -l "$apk" | grep -q "lib/arm64-v8a/$lib" || { echo "::error::No $lib in Montage's APK"; exit 1; }
          done
          mkdir -p ../../dist
          cp "$apk" "../../dist/Montage-$MONTAGE_VERSION.apk"
          ls -l ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: montage-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [prepare, windows, android, montage-android]
    if: ${{ always() && needs.prepare.result == 'success' && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      # Montage's APK goes in when its build made one.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: montage-android
          path: dist

      - name: Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          MONTAGE_VERSION: ${{ needs.prepare.outputs.montage_version }}
          CAM2YOU: ${{ needs.prepare.outputs.cam2you }}
          MONTAGE: ${{ needs.prepare.outputs.montage }}
          PUBLISH: ${{ inputs.publish }}
          REPLACE: ${{ inputs.replace }}
        run: |
          montage_apk="Montage-$MONTAGE_VERSION.apk"
          {
            echo "Cam2You $VERSION."
            echo
            echo '**Windows** 10 and 11, 64-bit:'
            echo
            echo "- **Cam2You-Setup-$VERSION.exe**: everything in one — Cam2You, and Montage (ticked; it edits your videos into one film by itself)."
            echo "- **Cam2You-Web-Setup-$VERSION.exe**: the small one — asks the same, then downloads from this release only what you choose."
            echo '- Cam2You-Only-Setup and Montage-Setup: what the small one downloads.'
            echo
            echo '**Android** 10 or newer:'
            echo
            echo "- **Cam2You-$VERSION.apk**: open it on the phone to install Cam2You (the first time, Android asks you to allow your browser to install apps)."
            if [ -f "$montage_apk" ]; then
              echo "- **$montage_apk**: Montage, for Auto-edit on the phone (64-bit ARM phones)."
            fi
            echo
            echo "Built from cam2you ${CAM2YOU:0:7} and Montage ${MONTAGE:0:7}."
            echo
            echo '```'
            sha256sum -- * | sort -k2
            echo '```'
          } > ../notes.md
          if [ ! -f "$montage_apk" ]; then
            echo "::warning::Montage's Android build failed: the release has no $montage_apk"
          fi
          if [ "$REPLACE" = true ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes > /dev/null 2>&1 || true
          fi
          draft=()
          if [ "$PUBLISH" != true ]; then draft=(--draft); fi
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Cam2You $VERSION" --notes-file ../notes.md "${draft[@]}"
