# Builds Cam2You for Windows and Android, with Auto-edit's engine built into
# it (cam2you's engine/, SPEC §8.12), and publishes them as a
# release of this repository, tagged cam2you-v<version>: the Download section
# of tie-games.com/cam2you links to the newest one, and Cam2You's small web
# installer downloads from it (cam2you's SPEC §13.1). It runs here, in the
# site's public repository, where Actions minutes are free; the sources stay
# private: they are only checked out on the runners.
#
# The release also gets update.json, every desktop file with its SHA-256,
# signed with the key in UPDATE_SIGNING_KEY (update.json.minisig, made by
# .github/scripts/update-manifest.py): the desktop apps update themselves from
# it, as the Android app does from the APKs.
#
# Run it by hand: Actions → Cam2You release → Run workflow. Before a release
# is made the Windows installer is tried on its runner (installed, started
# with its self-check — the engine loads and auto-edits two clips — and
# removed again) and Cam2You's APK on an Android emulator (installed and
# started; the emulator is x86-64, so the 64-bit ARM engine is only checked
# to be in the APK). Everything must succeed.
#
# Linux, macOS and iOS are built by workflows of their own (build-linux.yml,
# build-macos.yml, build-ios.yml), called from here. Each uploads its files as
# an artifact named dist-<platform> and a line or two for the release notes as
# notes-<platform>. Platforms leaves some out, for a quicker try; Release
# "none" builds and tries without making a release.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SOURCE_TOKEN       a fine-grained personal access token: owner TIE-Channel,
#                      repository cam2you, permission Contents:
#                      Read-only
#   BUILD_CONFIG_JSON  cam2you's build_config.json (Google sign-in, its SPEC
#                      §8.11); without it Cam2You is built without sign-in
#   ANDROID_SIGNING    the TIE-Games Android signing key, as JSON: "keystore"
#                      (a PKCS #12 file, base64), "password", "alias". Every
#                      version must be signed with it, or Android won't
#                      install it over the last one. A draft can do without
#                      (a throwaway key, not to be installed over a release).
#   UPDATE_SIGNING_KEY the key that signs update.json, which the desktop apps
#                      update themselves from (cam2you's SPEC §13.1): an
#                      unencrypted minisign secret key (minisign -G -W), the
#                      key file's text. The apps trust only its public half
#                      (and a backup's). A published release needs it; a
#                      draft without it gets an unsigned update.json, which
#                      the apps refuse.
name: Cam2You release

on:
  workflow_dispatch:
    inputs:
      cam2you_ref:
        description: Cam2You branch, tag or commit
        default: main
      release:
        description: Publish the release, make a draft (seen only by those who can edit this repository), or none (only build and try)
        type: choice
        options: [publish, draft, none]
        default: publish
      replace:
        description: Replace the release of this version if there is one
        type: boolean
        default: false
      platforms:
        description: Which to build
        default: windows,android,linux,macos,ios

permissions:
  contents: write

# Releases one at a time; tries side by side.
concurrency:
  group: cam2you-release-${{ inputs.release == 'none' && github.run_id || 'release' }}

env:
  FLUTTER_VERSION: 3.47.5
  # Compiler warnings would quote the private sources in this public log.
  RUSTFLAGS: -Awarnings

jobs:
  # The version, and the commits every job builds, whatever the branches do
  # meanwhile.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      cam2you: ${{ steps.version.outputs.cam2you }}
    steps:
      - name: Secrets
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          BUILD_CONFIG_JSON: ${{ secrets.BUILD_CONFIG_JSON }}
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          PUBLISH: ${{ inputs.release == 'publish' }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo '::error::No SOURCE_TOKEN secret: see the top of .github/workflows/cam2you-release.yml'; exit 1
          fi
          if [ -z "$BUILD_CONFIG_JSON" ]; then
            echo '::warning::No BUILD_CONFIG_JSON secret: Cam2You is built without Google sign-in'
          fi
          if [ -z "$ANDROID_SIGNING" ]; then
            if [ "$PUBLISH" = true ]; then
              echo '::error::No ANDROID_SIGNING secret: a published release needs the TIE-Games key, or its APKs would not update the installed apps (see the top of this file)'; exit 1
            fi
            echo "::warning::No ANDROID_SIGNING secret: this draft's APKs are signed with a throwaway key; don't install them over a release"
          fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ "$PUBLISH" = true ]; then
              echo '::error::No UPDATE_SIGNING_KEY secret: a published release needs it to sign update.json, or the desktop apps would not update themselves from it (see the top of this file)'; exit 1
            fi
            if [ "$RELEASE" = draft ]; then
              echo "::warning::No UPDATE_SIGNING_KEY secret: this draft's update.json is not signed, and the desktop apps will not update from it"
            fi
          fi

      - uses: actions/checkout@v4
        with:
          repository: TIE-Channel/cam2you
          ref: ${{ inputs.cam2you_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: cam2you
          persist-credentials: false

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace }}
          RELEASE: ${{ inputs.release }}
        run: |
          version=$(grep -oP '^version:\s*\K[\d.]+' cam2you/pubspec.yaml)
          tag="cam2you-v$version"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "cam2you=$(git -C cam2you rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" != none ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [ "$REPLACE" != true ]; then
            echo "::error::Cam2You $version is released already: raise the version in cam2you's pubspec.yaml, or tick Replace"; exit 1
          fi

  windows:
    needs: prepare
    if: contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TIE-Channel/cam2you
          ref: ${{ needs.prepare.outputs.cam2you }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: cam2you
          persist-credentials: false

      # Built from a short folder: whisper.cpp's build in the engine nests
      # deep paths (cargokit's .ck), and cl.exe stops at 260 characters,
      # which D:\a\tie-games-com\tie-games-com\ goes past.
      - name: Short path
        run: |
          robocopy cam2you C:\C /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw 'cam2you was not copied' }
          exit 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      # cl, Ninja and CMake for whisper.cpp in the engine.
      - uses: ilammy/msvc-dev-cmd@v1
      # Speech recognition on the graphics card (whisper.cpp's Vulkan backend):
      # the SDK only, so the runner has no Vulkan loader of its own, like a PC
      # without a graphics driver that brings one (the app's own, from
      # media_kit, serves then).
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            C:\C\.ck
          # The build's environment too: Cargo doesn't notice whisper.cpp's
          # settings in it (GGML_NATIVE).
          key: engine-windows-${{ hashFiles('cam2you/engine/Cargo.lock', 'cam2you/engine/scripts/env-windows.ps1') }}-${{ github.run_id }}
          restore-keys: engine-windows-${{ hashFiles('cam2you/engine/Cargo.lock', 'cam2you/engine/scripts/env-windows.ps1') }}-

      # The app with the engine in it (CAM2YOU_ENGINE=1, set by the script),
      # against the same LGPL FFmpeg it bundles.
      - name: Cam2You
        working-directory: C:\C
        env:
          BUILD_CONFIG_JSON: ${{ secrets.BUILD_CONFIG_JSON }}
        run: |
          $define = $null
          if ($env:BUILD_CONFIG_JSON) {
            [IO.File]::WriteAllText("$PWD/build_config.json", $env:BUILD_CONFIG_JSON)
            $define = '--dart-define-from-file=build_config.json'
          }
          flutter pub get
          dart run tool/fetch_ffmpeg.dart
          . ./engine/scripts/env-windows.ps1
          flutter build windows --release $define
          $engine = 'build\windows\x64\runner\Release\cam2you_engine.dll'
          if (-not (Test-Path $engine)) { throw "No engine in the build: $engine" }
          "The engine: $((Get-Item $engine).Length) bytes"

      - name: Installers
        working-directory: C:\C
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
          dart run tool/build_installer.dart
          Get-ChildItem build/installer/*.exe | Format-Table Name, Length
          $sizes = (Get-ChildItem build/installer/*.exe | ForEach-Object { "$($_.Name) $($_.Length) bytes" }) -join '; '
          "::notice title=Windows installers::$sizes"

      # The full installer as a user runs it, unattended: Cam2You installed
      # for this user, started with its self-check (two clips to join and
      # auto-edit), removed again.
      - name: Install, start, remove
        working-directory: C:\C\build\installer
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          function WaitFor([scriptblock] $done, [int] $seconds) {
            for ($i = 0; $i -lt $seconds -and -not (& $done); $i++) { Start-Sleep 1 }
            return (& $done)
          }
          $programs = "$env:LOCALAPPDATA\Programs"
          $media = Test-Path "$env:WINDIR\System32\mfplat.dll"
          if (-not $media) {
            # Windows Server has Media Foundation as a feature; Windows 10 and 11 have it.
            Install-WindowsFeature Server-Media-Foundation -ErrorAction SilentlyContinue | Out-Null
            $media = Test-Path "$env:WINDIR\System32\mfplat.dll"
          }
          $loader = Test-Path "$env:WINDIR\System32\vulkan-1.dll"
          "Media Foundation: $media; Windows' own Vulkan loader: $loader"

          $log = "$env:RUNNER_TEMP\setup.log"
          $setup = Start-Process -Wait -PassThru ".\Cam2You-Setup-$env:VERSION.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log"
          if ($setup.ExitCode -ne 0) { Get-Content $log -Tail 30; throw "The installer failed: $($setup.ExitCode)" }
          $cam = "$programs\Cam2You\cam2you.exe"
          if (-not (Test-Path $cam)) { throw "No $cam" }
          if (-not (Test-Path "$programs\Cam2You\cam2you_engine.dll")) { throw 'No engine (cam2you_engine.dll) installed' }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Cam2You.lnk")) { throw 'No desktop shortcut' }

          # Cam2You opens its database once it is up.
          $p = Start-Process $cam -PassThru
          $db = WaitFor { Get-ChildItem $env:APPDATA -Recurse -Depth 3 -Filter state.sqlite -ErrorAction SilentlyContinue } 90
          if (-not $db) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'Cam2You made no database within 90 s' }
          $support = (Get-ChildItem $env:APPDATA -Recurse -Depth 3 -Filter state.sqlite | Select-Object -First 1).DirectoryName
          "Cam2You starts; its data: $support"
          # The clips the self-check joins and auto-edits, made by the bundled FFmpeg;
          # then Cam2You again, which finds them.
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          $clips = New-Item -ItemType Directory -Force "$support\SelfCheck"
          $ffmpeg = "$programs\Cam2You\ffmpeg\ffmpeg.exe"
          foreach ($i in 1, 2) {
            & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=6" `
              -f lavfi -i "sine=frequency=$(300 * $i):duration=6" -c:v libopenh264 -b:v 2M -c:a aac -shortest "$clips\clip$i.mp4"
            if ($LASTEXITCODE -ne 0) { throw 'No self-check clips' }
          }
          Remove-Item "$support\self-check.json" -ErrorAction SilentlyContinue
          $env:CAM2YOU_SELF_CHECK = '1'
          $p = Start-Process $cam -PassThru
          $checked = WaitFor { Test-Path "$support\self-check.json" } 600
          $running = -not $p.HasExited
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $checked) {
            Get-Content "$support\self-check.running.json" -ErrorAction SilentlyContinue
            throw "No self-check within 600 s (Cam2You running: $running)"
          }
          $result = Get-Content "$support\self-check.json" -Raw
          $result
          $json = $result | ConvertFrom-Json
          if (-not $json.engine.ok) { throw "The engine did not load or work: $($json.engine.error)" }
          if (-not $json.'auto-edit'.ok) { throw "Auto-edit did not work: $($json.'auto-edit'.error)" }
          if (-not $json.ok) { '::warning::Not every self-check passed (see above)' }
          'The engine loads and auto-edits'
          $e = $json.engine; $a = $json.'auto-edit'
          "::notice title=Windows self-check::engine $($e.version), speech $($e.speech), music plan $($e.took_ms) ms; auto-edit $($a.bytes) bytes in $($a.took_ms) ms; all checks ok: $($json.ok)"

          $app = "$programs\Cam2You"
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if (-not (WaitFor { -not (Test-Path "$app\unins000.exe") } 120)) { throw "$app was not removed" }
          'Removed'

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: C:\C\build\installer\*.exe
          if-no-files-found: error

  # Cam2You for Android phones: one APK for 64-bit ARM phones and x86-64
  # (Chromebooks, the emulator), signed with the TIE-Games key, then installed
  # and started on an Android 14 emulator. The engine (Auto-edit) is built for
  # 64-bit ARM only, against FFmpeg for Android built first (kept in the
  # cache while its script is the same); x86-64 runs without it.
  android:
    needs: prepare
    if: contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TIE-Channel/cam2you
          ref: ${{ needs.prepare.outputs.cam2you }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: cam2you
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Tools and NDK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q meson ninja-build pkg-config xxd
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' > /dev/null

      - uses: actions/cache@v4
        id: ffmpeg
        with:
          path: cam2you/engine/third_party/ffmpeg-android
          key: engine-ffmpeg-android-${{ hashFiles('cam2you/engine/scripts/build-ffmpeg-android.sh') }}
      # With the runner's NDK (the same r28c) rather than a second download.
      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          export WORK="$RUNNER_TEMP/ffmpeg-android"
          mkdir -p "$WORK"
          ln -s "$ANDROID_HOME/ndk/28.2.13676358" "$WORK/android-ndk-r28c"
          bash cam2you/engine/scripts/build-ffmpeg-android.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: engine-android-cargo-${{ hashFiles('cam2you/engine/Cargo.lock') }}
          restore-keys: engine-android-cargo-

      - name: Signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          signing = os.environ.get('ANDROID_SIGNING')
          if not signing:
              print('A throwaway debug key: no ANDROID_SIGNING secret')
              raise SystemExit
          key = json.loads(signing)
          print(f"::add-mask::{key['password']}")
          path = os.path.join(os.environ['RUNNER_TEMP'], 'tie-games.p12')
          with open(path, 'wb') as f:
              f.write(base64.b64decode(key['keystore']))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"ANDROID_KEYSTORE={path}\nANDROID_KEYSTORE_PASSWORD={key['password']}\n")
              env.write(f"ANDROID_KEY_ALIAS={key.get('alias', 'tie-games')}\n")
          PY

      - name: Cam2You
        working-directory: cam2you
        env:
          BUILD_CONFIG_JSON: ${{ secrets.BUILD_CONFIG_JSON }}
        run: |
          define=()
          if [ -n "$BUILD_CONFIG_JSON" ]; then
            printf '%s' "$BUILD_CONFIG_JSON" > build_config.json
            define=(--dart-define-from-file=build_config.json)
          fi
          flutter pub get
          source engine/scripts/env-cam2you-android.sh
          flutter build apk --release --target-platform android-arm64,android-x64 "${define[@]}"
          apk=build/app/outputs/flutter-apk/app-release.apk
          # Flutter makes an APK without the engine when its build fails: it must be there.
          for lib in libcam2you_engine.so libavcodec.so libc++_shared.so; do
            unzip -l "$apk" | grep -q "lib/arm64-v8a/$lib" || { echo "::error::No $lib in the APK"; exit 1; }
          done
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/(libcam2you_engine|libav)' | awk '{print $1, $4}'
          mkdir -p ../dist
          cp "$apk" "../dist/Cam2You-$VERSION.apk"
          engine=$(unzip -l "$apk" | awk '$4 == "lib/arm64-v8a/libcam2you_engine.so" { print $1 }')
          echo "::notice title=Android APK::Cam2You-$VERSION.apk $(stat -c %s "../dist/Cam2You-$VERSION.apk") bytes; the engine $engine bytes uncompressed"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "../dist/Cam2You-$VERSION.apk" | grep -E 'certificate (DN|SHA-256)'
          ls -l ../dist

      # The emulator needs KVM, which the runner has but doesn't open to it.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          cat > smoke.sh <<'SH'
          set -euo pipefail
          mkdir -p test
          adb install -r "dist/Cam2You-$VERSION.apk"
          adb logcat -c
          adb shell monkey -p com.tiegames.cam2you -c android.intent.category.LAUNCHER 1 > /dev/null
          sleep 40
          adb exec-out screencap -p > test/cam2you-android.png || true
          if adb logcat -d | grep -q 'FATAL EXCEPTION'; then
            adb logcat -d | grep -A40 'FATAL EXCEPTION' | head -80
            echo '::error::Cam2You crashed on Android'; exit 1
          fi
          if ! adb shell pidof com.tiegames.cam2you > /dev/null; then
            adb logcat -d -s AndroidRuntime:E flutter:V | tail -60
            echo '::error::Cam2You is not running 40 s after it was started'; exit 1
          fi
          echo 'Cam2You installs and starts on Android 14'
          SH
      - name: Install and start on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test
          path: test/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk
          if-no-files-found: error

  linux:
    needs: prepare
    if: contains(inputs.platforms, 'linux')
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit
    with:
      cam2you: ${{ needs.prepare.outputs.cam2you }}
      version: ${{ needs.prepare.outputs.version }}

  macos:
    needs: prepare
    if: contains(inputs.platforms, 'macos')
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit
    with:
      cam2you: ${{ needs.prepare.outputs.cam2you }}
      version: ${{ needs.prepare.outputs.version }}

  ios:
    needs: prepare
    if: contains(inputs.platforms, 'ios')
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit
    with:
      cam2you: ${{ needs.prepare.outputs.cam2you }}
      version: ${{ needs.prepare.outputs.version }}

  # Every platform built must have succeeded (one left out by Platforms is
  # skipped).
  release:
    needs: [prepare, windows, android, linux, macos, ios]
    if: >-
      ${{ always() && inputs.release != 'none' && needs.prepare.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.windows.result)
      && contains(fromJSON('["success", "skipped"]'), needs.android.result)
      && contains(fromJSON('["success", "skipped"]'), needs.linux.result)
      && contains(fromJSON('["success", "skipped"]'), needs.macos.result)
      && contains(fromJSON('["success", "skipped"]'), needs.ios.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: site
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: notes-*
          merge-multiple: true
          path: notes

      # update.json: every desktop file of the release with its SHA-256,
      # signed (update.json.minisig); the desktop apps update from it.
      - name: Update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PUBLISH: ${{ inputs.release == 'publish' }}
        run: |
          require=()
          if [ "$PUBLISH" = true ]; then require=(--require-key); fi
          python3 site/.github/scripts/update-manifest.py dist --tag "$TAG" --version "$VERSION" "${require[@]}"

      - name: Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CAM2YOU: ${{ needs.prepare.outputs.cam2you }}
          PUBLISH: ${{ inputs.release == 'publish' }}
          REPLACE: ${{ inputs.replace }}
        run: |
          {
            echo "Cam2You $VERSION."
            echo
            if [ -f "Cam2You-Setup-$VERSION.exe" ]; then
              echo '**Windows** 10 and 11, 64-bit:'
              echo
              echo "- **Cam2You-Setup-$VERSION.exe**: everything in one, Auto-edit included."
              echo "- **Cam2You-Web-Setup-$VERSION.exe**: the small one — asks the same, then downloads Cam2You from this release."
              echo '- Cam2You-Only-Setup: what the small one and the updates download.'
              echo
            fi
            if [ -f "Cam2You-$VERSION.apk" ]; then
              echo '**Android** 10 or newer:'
              echo
              echo "- **Cam2You-$VERSION.apk**: open it on the phone to install Cam2You (the first time, Android asks you to allow your browser to install apps)."
              echo
            fi
            # The other platforms' own lines, in their order (3-linux.md, 4-macos.md, …).
            for notes in $(ls ../notes/*.md 2>/dev/null | sort); do
              cat "$notes"
              echo
            done
            echo "Built from cam2you ${CAM2YOU:0:7}."
            echo
            echo '```'
            sha256sum -- * | sort -k2
            echo '```'
          } > ../notes.md
          if [ "$REPLACE" = true ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes > /dev/null 2>&1 || true
          fi
          draft=()
          if [ "$PUBLISH" != true ]; then draft=(--draft); fi
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Cam2You $VERSION" --notes-file ../notes.md "${draft[@]}"
